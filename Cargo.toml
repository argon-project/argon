[package]
name = "argon"
version = "0.1.0"
edition = "2024"

[dependencies]
bimap = "0.6.3"
clap = { version = "4.5.41", features = ["derive"] }
colored = "3.0.0"
encoding = "0.2.33"
enum-assoc = "1.2.4"
glob = "0.3.2"
json5 = "0.4.1"
lenient_semver = { version = "0.4.2", features = ["version_serde"] }
log = "0.4.27"
petgraph = "0.8.2"
pulldown-cmark = { path = "../pulldown-cmark/pulldown-cmark" }
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive", "serde_derive"] }
serde_derive = "1.0.219"
simple_logger = "5.0.0"
strum = "0.27.1"
strum_macros = "0.27.1"
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["full"] }
tree-sitter = "0.25.4"
tree-sitter-c = { path = "../tree-sitter-c" }
tree-sitter-md = { path = "../tree-sitter-markdown" }
url = "2.5.7"
walkdir = "2.5.0"

[lib]
name = "argon"
path = "src/lib.rs"

[[bin]]
name = "argon"
path = "src/main.rs"
